name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM India time (18:29 UTC)
    - cron: '29 18 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install report dependencies
        run: python -m pip install reportlab matplotlib

      - name: Generate weekly PDF report
        run: python generate_report.py weekly

      - name: Archive and commit report
        run: |
          mkdir -p weekly_reports
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
            git push
          fi

